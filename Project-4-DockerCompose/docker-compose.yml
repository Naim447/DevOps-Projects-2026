services:
  # --- Application: Node.js + Express ---
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: compose-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      MONGO_URI: mongodb://${MONGO_USER:-appuser}:${MONGO_PASSWORD:-apppassword}@mongo:27017/${MONGO_DB:-appdb}?authSource=${MONGO_DB:-appdb}
      REDIS_URL: redis://redis:6379
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      # App is reached through Nginx (port 80). Keep 3000 published
      # only for direct debugging; remove it in production.
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Database: MongoDB ---
  mongo:
    image: mongo:7
    container_name: compose-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-appdb}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Published only for local debugging (mongosh / Compass).
      # Remove this in production — the app reaches Mongo over the network.
      - "27017:27017"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Cache: Redis ---
  redis:
    image: redis:7-alpine
    container_name: compose-redis
    restart: unless-stopped
    # Persist cache data across restarts (optional for a cache, useful in a lab).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Reverse proxy: Nginx ---
  nginx:
    image: nginx:alpine
    container_name: compose-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
    name: project4-mongo-data
  redis_data:
    name: project4-redis-data
