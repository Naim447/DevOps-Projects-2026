# Nginx reverse proxy — the only service exposed on port 80.
# All traffic goes: browser -> Nginx :80 -> app :3000
upstream app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # Health endpoint — used by the Compose healthcheck for Nginx itself.
    location = /health {
        proxy_pass http://app/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
