[defaults]
# Inventory and roles — relative to this project root.
inventory = inventory/hosts.ini
roles_path = roles
# Do not prompt to accept a new host key on first connect.
# Only use this for lab EC2 instances you just created.
host_key_checking = False
# Keep output readable; show the task name that changed.
stdout_callback = yaml
# Retry files clutter git — disable them.
retry_files_enabled = False
# Ask for the vault password only when a vault file is actually used.
# (Run with --ask-vault-pass when you add one.)
# vault_password_file = ~/.ansible/vault-password.txt

[ssh_connection]
# Reuse SSH connections — much faster on repeated runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

[privilege_escalation]
# Most tasks need root (apt, Apache, UFW). Become root with sudo.
become = True
become_method = sudo
become_ask_pass = False
