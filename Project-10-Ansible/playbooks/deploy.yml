---
# Fast redeploy — application files only, no Apache reinstall.
# Use after editing roles/app/templates/index.html.j2 or files/style.css.
# Run: ansible-playbook playbooks/deploy.yml
- name: Redeploy application files only
  hosts: webservers
  become: true
  gather_facts: true

  roles:
    - role: app
      tags: [app, deploy]

  post_tasks:
    - name: Check the site answers HTTP 200
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        status_code: 200
        return_content: false
      register: site_check
      failed_when: site_check.status != 200
      tags: [verify]
