---
# Apache role — install Apache, deploy the virtual host from a template,
# enable and start the service. Handlers restart Apache only on change.
- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
  notify: Restart Apache

- name: Deploy Apache virtual host from template
  ansible.builtin.template:
    src: apache-site.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Apache

- name: Enable Apache rewrite module (example — used by many apps)
  ansible.builtin.command: a2enmod rewrite
  register: a2enmod_result
  changed_when: "'already enabled' not in a2enmod_result.stdout"
  when: ansible_facts['os_family'] == "Debian"
  notify: Restart Apache

- name: Ensure Apache is enabled and running
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
