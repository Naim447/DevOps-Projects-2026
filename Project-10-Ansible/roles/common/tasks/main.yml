---
# Common role — base setup every server needs.
# Runs first, before apache / app.
# Built-in modules only — no Galaxy collection needed.
- name: Update apt cache (Debian / Ubuntu only)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Check current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_timezone
  changed_when: false
  failed_when: false
  when:
    - timezone is defined
    - ansible_facts['os_family'] == "Debian"

- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  when:
    - timezone is defined
    - ansible_facts['os_family'] == "Debian"
    - current_timezone.stdout is defined
    - current_timezone.stdout != timezone
