# Same inventory as hosts.ini, in YAML form.
# Use ONE of them: ansible.cfg points at hosts.ini by default.
# To use this file instead: ansible-playbook -i inventory/hosts.yml playbooks/site.yml
---
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    webservers:
      hosts:
        # 203.0.113.10 is a documentation IP (TEST-NET-3). Replace it.
        web1:
          ansible_host: 203.0.113.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/keys/my-key.pem
