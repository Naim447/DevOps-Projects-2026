# Inventory — EDIT THIS FILE with your real EC2 details.
# 203.0.113.10 is a documentation IP (TEST-NET-3). It will not connect.
# Replace it with your EC2 public IP or public DNS name.
#
# One server (the Project 1 setup):
[webservers]
web1 ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/keys/my-key.pem

# More servers — same playbook, no code change:
# web2 ansible_host=203.0.113.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/keys/my-key.pem

# Group for everything (used by group_vars/all.yml)
[all:vars]
ansible_python_interpreter=/usr/bin/python3
