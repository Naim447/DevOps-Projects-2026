# Logstash pipeline: app logs in, Elasticsearch out.
# Input: JSON lines over TCP from the app (see app/src/logger.js).
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # The app already sends JSON with timestamp, level, service, message.
  # Add the environment so you can filter dev/prod later.
  mutate {
    add_field => { "environment" => "dev" }
  }
  # Normalise the level field so Kibana filters work the same way
  # no matter which service sent the log.
  mutate {
    lowercase => [ "level" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  # Also print to Logstash's own stdout — useful while debugging:
  # docker compose logs logstash
  stdout { codec => rubydebug }
}
