apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-node-app
  namespace: project-5
  labels:
    app: k8s-node-app
spec:
  # 3 replicas: if one Pod dies, the other two keep serving.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: k8s-node-app
  template:
    metadata:
      labels:
        app: k8s-node-app
    spec:
      containers:
        - name: app
          # Replace YOUR_DOCKERHUB_USERNAME before you deploy.
          # For Minikube without pushing, use: minikube image load <image>
          # and keep imagePullPolicy: IfNotPresent (below).
          image: YOUR_DOCKERHUB_USERNAME/k8s-node-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: k8s-node-app-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-node-app-secret
                  key: API_KEY
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Readiness: do not send traffic until /health answers.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Liveness: restart the container if /health stops answering.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
