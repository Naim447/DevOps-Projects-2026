apiVersion: v1
kind: Secret
metadata:
  name: k8s-node-app-secret
  namespace: project-5
  labels:
    app: k8s-node-app
type: Opaque
# stringData is plain text here on purpose — kubectl base64-encodes it
# when it creates the Secret. This is an EXAMPLE value only.
# Change it before any real use, and never commit a real secret.
stringData:
  API_KEY: "change-me-in-production"
